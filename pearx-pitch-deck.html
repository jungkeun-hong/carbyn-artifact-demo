<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carbyn · PearX Pitch Deck</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #060607;
    color: #F4F4F2;
    font-family: system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .deck {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    padding: 28px 16px 64px;
  }
  .artboard-wrap {
    width: 100%;
    max-width: 1920px;
    aspect-ratio: 16 / 9;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.06);
    background: #0B0B0C;
  }
  .artboard-wrap img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
  }
  @page { size: 1920px 1080px; margin: 0; }
  @media print {
    html, body { background: #0B0B0C; }
    .deck { gap: 0; padding: 0; }
    .artboard-wrap {
      width: 1920px !important;
      height: 1080px !important;
      max-width: none;
      border-radius: 0;
      box-shadow: none;
      page-break-after: always;
      break-after: page;
    }
  }
</style>
</head>
<body>
<div class="deck">
  <div class="artboard-wrap"><img src="assets/pearx_slides/01_cover.jpg" alt="01 · Cover" /></div>
  <div class="artboard-wrap"><img src="assets/pearx_slides/02_discovery.jpg" alt="02 · 200+ Job Sites" /></div>
  <div class="artboard-wrap"><img src="assets/pearx_slides/03_problem.jpg" alt="03 · 30% on the Tools" /></div>
  <div class="artboard-wrap"><img src="assets/pearx_slides/04_solution.jpg" alt="04 · Solution" /></div>
  <div class="artboard-wrap"><img src="assets/pearx_slides/05_vision_stages.jpg" alt="05 · Long-Term Vision (4 Stages)" /></div>
  <div class="artboard-wrap"><img src="assets/pearx_slides/06_vision_flywheel.jpg" alt="06 · Long-Term Vision (Flywheel)" /></div>
  <div class="artboard-wrap"><img src="assets/pearx_slides/07_vision_moat.jpg" alt="07 · Long-Term Vision (Data Moat)" /></div>
  <div class="artboard-wrap"><img src="assets/pearx_slides/08_traction.jpg" alt="08 · Traction" /></div>
  <div class="artboard-wrap"><img src="assets/pearx_slides/09_team.jpg" alt="09 · Team & Advisors" /></div>
</div>
</body>
</html>
